apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-frontend
  labels:
    app: helloworld-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helloworld-frontend
  template:
    metadata:
      labels:
        app: helloworld-frontend
    spec:
      containers:
        - name: frontend
          image: helloworld-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helloworld-frontend
  labels:
    app: helloworld-frontend
spec:
  type: NodePort
  selector:
    app: helloworld-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
