apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-backend
  labels:
    app: helloworld-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helloworld-backend
  template:
    metadata:
      labels:
        app: helloworld-backend
    spec:
      containers:
        - name: backend
          image: helloworld-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helloworld-backend
  labels:
    app: helloworld-backend
spec:
  type: ClusterIP
  selector:
    app: helloworld-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Optional direct-access service so the backend can be hit on its own
# NodePort (host 12001) for testing.
apiVersion: v1
kind: Service
metadata:
  name: helloworld-backend-nodeport
  labels:
    app: helloworld-backend
spec:
  type: NodePort
  selector:
    app: helloworld-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
